[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnma-platform"
version = "0.1.0"
description = "Component Network Meta-Analysis Platform for analyzing multi-component interventions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "CNMA Platform Contributors"}
]
keywords = [
    "meta-analysis",
    "network-meta-analysis",
    "component-network-meta-analysis",
    "systematic-review",
    "bayesian-statistics",
    "healthcare-research"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pymc>=5.10.0",
    "arviz>=0.17.0",
    "networkx>=3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.7.0",
    "transformers>=4.35.0",
    "sentence-transformers>=2.2.0",
]
viz = [
    "plotly>=5.17.0",
    "graphviz>=0.20.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/mahmood726-cyber/Idea1"
Documentation = "https://github.com/mahmood726-cyber/Idea1/docs"
Repository = "https://github.com/mahmood726-cyber/Idea1"
Issues = "https://github.com/mahmood726-cyber/Idea1/issues"

[tool.setuptools]
packages = ["cnma_platform"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=cnma_platform --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
